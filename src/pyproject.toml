[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "xe-cs-plasma"
version = "0.1.3"
description = "Seminar Newton solver for one-temperature Xe and Cs plasma composition"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10", "matplotlib>=3.7"]

[project.scripts]
plasma-xe-cs = "plasma.cli:main"

[tool.setuptools]
py-modules = ["config"]

[tool.setuptools.packages.find]
where = ["."]
include = ["plasma*"]
